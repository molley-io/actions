name: Molley Progress Report
description: AI-generated progress report from git history and Molley activity, committed to /reports on develop or main

author: Molley

inputs:
  report_style:
    description: 'Report audience/style: slt | sales | developer. Ignored when routes is set.'
    required: false
    default: developer
  routes:
    description: >-
      Multi-report routing: one line per report as '<style>: <platform>:<ENV_VAR>, <platform>:<ENV_VAR>, ...'
      where platform is slack | teams | gchat and ENV_VAR names an env var holding that webhook URL.
      Example: 'slt: slack:SLACK_URL_A, slack:SLACK_URL_B' + newline + 'developer: slack:SLACK_URL_DEV'.
      When set, every listed style is generated and committed in one run and delivered to its own destinations.
    required: false
    default: ''
  days:
    description: Look-back window in days (max 14 — limited by the Molley activity API)
    required: false
    default: '7'
  molley_project_id:
    description: Molley project passport (same value used by the analyzer action)
    required: false
  reports_dir:
    description: Directory in the repository where reports are committed
    required: false
    default: reports
  output_branch:
    description: Branch to commit the report to. Empty = auto (develop if it exists, otherwise main)
    required: false
    default: ''
  model:
    description: Claude model used to write the report
    required: false
    default: claude-opus-4-6

outputs:
  report_paths:
    description: Space-separated repository-relative paths of the committed report(s)
    value: ${{ steps.commit.outputs.report_paths }}
  report_branch:
    description: Branch the report(s) were committed to
    value: ${{ steps.commit.outputs.report_branch }}

runs:
  using: composite
  steps:
    - name: Checkout repository (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate required environment
      shell: bash
      env:
        REPORT_STYLE: ${{ inputs.report_style }}
        ROUTES: ${{ inputs.routes }}
      run: |
        set -euo pipefail
        echo "[molley] Validating required environment"
        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "ANTHROPIC_API_KEY is required"
          exit 1
        fi

        if [ -n "${ROUTES:-}" ]; then
          node -e "
            const validStyles = ['slt', 'sales', 'developer'];
            const validPlatforms = ['slack', 'teams', 'gchat'];
            for (const line of (process.env.ROUTES || '').split('\n')) {
              const t = line.trim();
              if (!t) continue;
              const i = t.indexOf(':');
              if (i < 1) { console.error('Invalid routes line (expected \"style: platform:ENV_VAR, ...\"): ' + t); process.exit(1); }
              const style = t.slice(0, i).trim().toLowerCase();
              if (!validStyles.includes(style)) { console.error('Invalid style in routes: \"' + style + '\" — must be one of: ' + validStyles.join(', ')); process.exit(1); }
              for (const d of t.slice(i + 1).split(',')) {
                const dt = d.trim();
                if (!dt) continue;
                const j = dt.indexOf(':');
                const platform = j < 0 ? dt : dt.slice(0, j).trim().toLowerCase();
                const envName = j < 0 ? '' : dt.slice(j + 1).trim();
                if (!validPlatforms.includes(platform)) { console.error('Invalid destination \"' + dt + '\" — use slack:ENV_VAR, teams:ENV_VAR or gchat:ENV_VAR'); process.exit(1); }
                if (!/^[A-Za-z_][A-Za-z0-9_]*\$/.test(envName)) { console.error('Invalid env var name in destination \"' + dt + '\"'); process.exit(1); }
              }
            }
            console.log('[molley] routes input is valid');
          "
        else
          STYLE="$(echo "$REPORT_STYLE" | tr '[:upper:]' '[:lower:]')"
          case "$STYLE" in
            slt|sales|developer) ;;
            *)
              echo "Invalid report_style '${REPORT_STYLE}' — must be one of: slt, sales, developer"
              exit 1
              ;;
          esac
          echo "[molley] Report style: ${STYLE}"
        fi
        echo "[molley] Environment is valid"

    - name: Install Claude Code CLI
      shell: bash
      run: |
        set -euo pipefail
        echo "[molley] Installing Claude Code CLI"
        npm install -g @anthropic-ai/claude-code
        echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
        echo "[molley] Node version: $(node --version)"

    - name: Setup Molley MCP Server for product activity
      id: mcp-setup
      continue-on-error: true
      shell: bash
      env:
        MOLLEY_API_KEY: ${{ env.MOLLEY_API_KEY }}
        MOLLEY_COMPANY_ID: ${{ env.MOLLEY_COMPANY_ID }}
        MOLLEY_PROJECT_PASSPORT: ${{ inputs.molley_project_id }}
      run: |
        set -euo pipefail

        if [ -z "${MOLLEY_API_KEY:-}" ]; then
          echo "[molley] MOLLEY_API_KEY not set — skipping MCP server setup (report will use git history only)"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RESOLVED_COMPANY_ID="${MOLLEY_COMPANY_ID:-}"
        RESOLVED_PROJECT_ID=""

        if [ -n "${MOLLEY_PROJECT_PASSPORT:-}" ]; then
          DECODED=$(node -e "
            const passport = process.env.MOLLEY_PROJECT_PASSPORT || '';
            const encoded = passport.split('.')[0] || '';
            try {
              const json = JSON.parse(Buffer.from(encoded, 'base64url').toString('utf8'));
              process.stdout.write(JSON.stringify(json));
            } catch { process.stdout.write('{}'); }
          " 2>/dev/null || echo '{}')

          PASSPORT_COMPANY=$(echo "$DECODED" | node -e "const d=require('fs').readFileSync(0,'utf8');try{process.stdout.write(JSON.parse(d).companyId||'')}catch{}" 2>/dev/null || true)
          PASSPORT_PROJECT=$(echo "$DECODED" | node -e "const d=require('fs').readFileSync(0,'utf8');try{process.stdout.write(JSON.parse(d).projectId||'')}catch{}" 2>/dev/null || true)

          if [ -z "$RESOLVED_COMPANY_ID" ] && [ -n "$PASSPORT_COMPANY" ]; then
            RESOLVED_COMPANY_ID="$PASSPORT_COMPANY"
          fi
          if [ -n "$PASSPORT_PROJECT" ]; then
            RESOLVED_PROJECT_ID="$PASSPORT_PROJECT"
          fi
        fi

        if [ -z "$RESOLVED_COMPANY_ID" ]; then
          echo "[molley] Cannot resolve company ID — skipping MCP server setup"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "[molley] Installing Molley MCP server"
        npm install -g @molley/mcp-server

        echo "[molley] Configuring MCP server credentials"
        npx @molley/mcp-server login --api-key "$MOLLEY_API_KEY" --company-id "$RESOLVED_COMPANY_ID"

        if command -v claude-code >/dev/null 2>&1; then
          CLAUDE_BIN="claude-code"
        elif command -v claude >/dev/null 2>&1; then
          CLAUDE_BIN="claude"
        else
          echo "[molley] Claude CLI not found — skipping MCP registration"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "[molley] Registering MCP server with Claude Code"
        "$CLAUDE_BIN" mcp add molley -- npx @molley/mcp-server

        echo "mcp_available=true" >> "$GITHUB_OUTPUT"
        echo "project_id=${RESOLVED_PROJECT_ID}" >> "$GITHUB_OUTPUT"
        echo "[molley] MCP server configured — Molley activity will be included in the report"

    - name: Build git activity digest
      id: git-digest
      shell: bash
      env:
        DAYS: ${{ inputs.days }}
      run: |
        set -euo pipefail
        echo "[molley] Building git digest for the last ${DAYS} days"
        DIGEST_FILE="/tmp/molley-git-digest.txt"
        SINCE="${DAYS} days ago"

        # No author fields anywhere: the report must describe the product, not people.
        {
          printf '%s\n' "== Commits (last ${DAYS} days, newest first, no merges) =="
          git log --no-merges --since="$SINCE" --date=short --pretty=format:'%ad %h %s' || true
          printf '\n\n%s\n' "== Merges / integrated branches (last ${DAYS} days) =="
          git log --merges --since="$SINCE" --date=short --pretty=format:'%ad %s' || true
          printf '\n\n%s\n' "== Activity by top-level area (files touched, lines added/removed) =="
          git log --no-merges --since="$SINCE" --numstat --pretty=format:'' \
            | awk 'NF==3 {
                n=split($3, p, "/");
                area = (n > 1) ? p[1] : "(repo root)";
                files[area]++;
                add[area] += $1 + 0;
                del[area] += $2 + 0;
              }
              END { for (a in files) printf "%s: %d changes, +%d/-%d lines\n", a, files[a], add[a], del[a] }' \
            | sort || true
          printf '\n%s\n' "== Totals =="
          printf 'Commits: %s\n' "$(git rev-list --no-merges --count --since="$SINCE" HEAD)"
          printf 'Merges: %s\n' "$(git rev-list --merges --count --since="$SINCE" HEAD)"
        } > "$DIGEST_FILE"

        echo "[molley] Digest size: $(wc -c < "$DIGEST_FILE") bytes"
        echo "digest_file=${DIGEST_FILE}" >> "$GITHUB_OUTPUT"

    - name: Generate report(s) with Claude Code
      id: report
      shell: bash
      env:
        REPORT_STYLE: ${{ inputs.report_style }}
        ROUTES: ${{ inputs.routes }}
        DAYS: ${{ inputs.days }}
        CLAUDE_MODEL: ${{ inputs.model }}
        MCP_AVAILABLE: ${{ steps.mcp-setup.outputs.mcp_available }}
        MCP_PROJECT_ID: ${{ steps.mcp-setup.outputs.project_id }}
        DIGEST_FILE: ${{ steps.git-digest.outputs.digest_file }}
      run: |
        set -euo pipefail

        if [ -n "${ROUTES:-}" ]; then
          STYLES="$(node -e "
            const styles = [];
            for (const line of (process.env.ROUTES || '').split('\n')) {
              const t = line.trim();
              if (!t) continue;
              const style = t.slice(0, t.indexOf(':')).trim().toLowerCase();
              if (style && !styles.includes(style)) styles.push(style);
            }
            process.stdout.write(styles.join(' '));
          ")"
        else
          STYLES="$(echo "$REPORT_STYLE" | tr '[:upper:]' '[:lower:]')"
        fi
        echo "[molley] Report styles to generate: ${STYLES} (last ${DAYS} days each)"

        build_prompt() {
          local STYLE="$1"
          local PROMPT_FILE="$2"
          {
          printf '%s\n' "You are writing a periodic product progress report covering the last ${DAYS} days for the repository you are running in (a monorepo — treat top-level directories/workspaces as product areas)."
          printf '%s\n' ""
          printf '%s\n' "NON-NEGOTIABLE RULES:"
          printf '%s\n' "- Never name, identify, or allude to any individual person: no author names, usernames, emails, or per-person statistics — even if they appear in commit messages or product tooling data. If a commit message contains a name, paraphrase the work without it."
          printf '%s\n' "- No blame, no shaming, no performance judgements about contributors. This report is about where the PRODUCT is moving, stuck, stalling, or winning — it is information, not accusation. Describe stalls as facts about the work ('the billing area saw no movement this week'), never as failures of people."
          printf '%s\n' "- Be honest: if something is stalled or blocked, say so plainly and factually."
          printf '%s\n' "- Never mention 'Molley' anywhere in the report — not as a tool name, data source, or brand. When you draw on its data, attribute it generically instead: 'the CRM', 'the requirements tool', 'product research', 'the product wiki', 'outreach tracking', and so on."
          printf '%s\n' "- Return MARKDOWN ONLY — no prose before or after the document, no code fences wrapping it."
          printf '%s\n' ""
          printf '%s\n' "HOW TO GATHER EVIDENCE:"
          printf '%s\n' "1. Start from the git digest below, then dig deeper yourself with git (e.g. 'git log --since=\"${DAYS} days ago\"', 'git show', 'git diff') and by reading the codebase to understand what the changes actually mean at product level. Interpret — do not just restate commit messages."

          if [ "${MCP_AVAILABLE:-false}" = "true" ]; then
            if [ -n "${MCP_PROJECT_ID:-}" ]; then
              printf '%s\n' "2. Use the Molley MCP server: call get_product_activity with projectId '${MCP_PROJECT_ID}' and days ${DAYS} for everything that happened on the product side (features, wiki, research, outreach, social, CRM). Also call get_product_overview with projectId '${MCP_PROJECT_ID}' to understand feature statuses and where the product is heading."
            else
              printf '%s\n' "2. Use the Molley MCP server: call list_products to find the product for this repository, then get_product_activity (days ${DAYS}) and get_product_overview for product-side activity and direction."
            fi
            printf '%s\n' "3. Weave BOTH sources together: git tells you what was built; the product tooling tells you what was planned, shipped, researched, and sold. Remember: in the report itself, refer to that tooling only in generic terms (CRM, requirements tool, product research, product wiki) — never by the name Molley."
          else
            printf '%s\n' "2. Product-side data is NOT available in this run — build the report from git history and the codebase alone, and note in the report that activity from the requirements/CRM tooling was not included (do not name the tool)."
          fi

          printf '%s\n' ""
          printf '%s\n' "REPORT STRUCTURE (H1 title first: '# Product Progress Report — ${STYLE^^} — last ${DAYS} days', then a metadata line with the date range and the audience):"
          printf '%s\n' "- ## Summary — 3-6 sentences: overall momentum and the single most important takeaway."
          printf '%s\n' "- ## Successes — what moved forward, shipped, or was unblocked."
          printf '%s\n' "- ## Blockers & Stalls — what is stuck or slowing, why (as far as evidence shows), and what it is waiting on."
          printf '%s\n' "- ## Where We're Heading — direction implied by in-progress work and the roadmap/feature statuses."
          printf '%s\n' "- ## Watch Items — early signals worth monitoring next period."
          printf '%s\n' ""

          case "$STYLE" in
            slt)
              printf '%s\n' "AUDIENCE: the senior leadership team."
              printf '%s\n' "- Write in plain business language; no code paths, file names, or technical jargon."
              printf '%s\n' "- Lead with momentum, risk, and strategic direction. Frame everything in terms of product outcomes, customer value, and delivery confidence."
              printf '%s\n' "- Keep it tight: the whole report should be readable in under three minutes."
              ;;
            sales)
              printf '%s\n' "AUDIENCE: the sales and marketing team."
              printf '%s\n' "- Focus on customer-visible progress: what shipped that a customer can see or buy, what is coming next and roughly when, and what changed in positioning-relevant capability."
              printf '%s\n' "- If CRM/outreach data is available, include outreach, social campaign, and CRM pipeline activity in a dedicated '## Go-to-Market Activity' section."
              printf '%s\n' "- Add a '## Talking Points' section: 3-5 bullets sales can use with prospects this week."
              printf '%s\n' "- Skip internal engineering detail unless it affects what can be promised to customers."
              ;;
            developer)
              printf '%s\n' "AUDIENCE: the engineering team."
              printf '%s\n' "- Be technically specific: which areas of the monorepo moved, which were churn hotspots, which are quiet or stalled."
              printf '%s\n' "- Cover delivery flow (merges/integrations), notable refactors, test/tooling changes, and technical debt signals."
              printf '%s\n' "- Add a '## Codebase Activity Map' section summarising per-area movement."
              printf '%s\n' "- Reference directories and subsystems freely, but still never authors."
              ;;
          esac

          printf '\n%s\n' "GIT DIGEST (pre-computed, last ${DAYS} days):"
          printf '%s\n' "-----BEGIN GIT DIGEST-----"
          head -c 40000 "$DIGEST_FILE"
          printf '\n%s\n' "-----END GIT DIGEST-----"
          } > "$PROMPT_FILE"
        }

        if command -v claude-code >/dev/null 2>&1; then
          CLAUDE_BIN="claude-code"
        elif command -v claude >/dev/null 2>&1; then
          CLAUDE_BIN="claude"
        else
          echo "[molley] Claude CLI binary not found after install"
          exit 1
        fi

        CLI_HELP="$($CLAUDE_BIN --help 2>&1 || true)"
        RUN_ARGS=()
        if printf '%s' "$CLI_HELP" | grep -q -- '--model'; then
          RUN_ARGS+=(--model "$CLAUDE_MODEL")
          echo "[molley] Using model: ${CLAUDE_MODEL}"
        fi
        if printf '%s' "$CLI_HELP" | grep -q -- '--dangerously-skip-permissions'; then
          RUN_ARGS+=(--dangerously-skip-permissions)
        fi
        if printf '%s' "$CLI_HELP" | grep -q -- '--print'; then
          RUN_ARGS+=(--print)
        fi

        heartbeat() {
          while true; do
            echo "[molley] Report generation still running..."
            sleep 20
          done
        }
        heartbeat &
        HEARTBEAT_PID=$!

        GENERATED_STYLES=""
        for STYLE in $STYLES; do
          echo "[molley] Generating ${STYLE} report"
          PROMPT_FILE="$(mktemp)"
          OUTPUT_FILE="/tmp/molley-progress-report-${STYLE}.md"
          build_prompt "$STYLE" "$PROMPT_FILE"

          STYLE_FAILED=0
          "$CLAUDE_BIN" "${RUN_ARGS[@]}" "$(cat "$PROMPT_FILE")" > "$OUTPUT_FILE" || STYLE_FAILED=1
          rm -f "$PROMPT_FILE"

          # Strip a wrapping markdown fence if the model added one despite instructions,
          # and scrub any 'Molley' brand mention that slipped past the prompt (the
          # .molley/ directory path is left intact — only the standalone name is replaced).
          if [ -s "$OUTPUT_FILE" ]; then
            OUTPUT_FILE="$OUTPUT_FILE" node -e "
              const fs = require('fs');
              const p = process.env.OUTPUT_FILE;
              let t = fs.readFileSync(p, 'utf8').trim();
              const m = t.match(/^\`\`\`(?:markdown|md)?\n([\s\S]*)\n\`\`\`\$/);
              if (m) t = m[1].trim();
              const scrubbed = t.replace(/\bMolley\b/g, 'the product tooling');
              if (scrubbed !== t) console.error('[molley] Scrubbed brand mention(s) from report output');
              fs.writeFileSync(p, scrubbed + '\n');
            "
          fi

          if [ "$STYLE_FAILED" -ne 0 ] || [ ! -s "$OUTPUT_FILE" ] || [ "$(wc -c < "$OUTPUT_FILE")" -lt 200 ]; then
            echo "[molley] ${STYLE} report generation failed or produced no usable output"
          else
            echo "[molley] ${STYLE} report size: $(wc -c < "$OUTPUT_FILE") bytes"
            GENERATED_STYLES="${GENERATED_STYLES}${GENERATED_STYLES:+ }${STYLE}"
          fi
        done

        kill "$HEARTBEAT_PID" 2>/dev/null || true
        wait "$HEARTBEAT_PID" 2>/dev/null || true

        if [ -z "$GENERATED_STYLES" ]; then
          echo "[molley] All report generations failed"
          exit 1
        fi

        echo "generated_styles=${GENERATED_STYLES}" >> "$GITHUB_OUTPUT"
        echo "[molley] Generated styles: ${GENERATED_STYLES}"

    - name: Commit report(s)
      id: commit
      shell: bash
      env:
        REPORTS_DIR: ${{ inputs.reports_dir }}
        OUTPUT_BRANCH: ${{ inputs.output_branch }}
        GENERATED_STYLES: ${{ steps.report.outputs.generated_styles }}
      run: |
        set -euo pipefail
        git config user.name "molley-bot"
        git config user.email "actions@users.noreply.github.com"

        if [ -n "$OUTPUT_BRANCH" ]; then
          target_branch="$OUTPUT_BRANCH"
        elif git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
          target_branch="develop"
        elif git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
          target_branch="main"
        else
          target_branch="${GITHUB_REF_NAME:-main}"
        fi
        echo "[molley] Target branch: ${target_branch}"

        STAMP="$(date -u +"%Y-%m-%d-%H%MZ")"

        pushed="false"
        for attempt in 1 2 3; do
          echo "[molley] Commit attempt ${attempt}/3 on branch ${target_branch}"
          git fetch origin "$target_branch"
          git checkout -B "molley-report-${GITHUB_RUN_ID:-local}" "origin/$target_branch"

          mkdir -p "$REPORTS_DIR"
          REPORT_PATHS=""
          for STYLE in $GENERATED_STYLES; do
            REPORT_PATH="${REPORTS_DIR}/${STAMP}-${STYLE}.md"
            cp "/tmp/molley-progress-report-${STYLE}.md" "$REPORT_PATH"
            git add "$REPORT_PATH"
            REPORT_PATHS="${REPORT_PATHS}${REPORT_PATHS:+ }${REPORT_PATH}"
          done
          git commit -m "docs(molley): progress report(s) ${STAMP} [${GENERATED_STYLES}]"

          if git push origin "HEAD:${target_branch}"; then
            echo "[molley] Report(s) pushed to ${target_branch}"
            pushed="true"
            break
          fi

          echo "[molley] Push failed due to branch movement; retrying"
        done

        if [ "$pushed" != "true" ]; then
          echo "[molley] Failed to push report(s) after retries"
          exit 1
        fi

        echo "report_paths=${REPORT_PATHS}" >> "$GITHUB_OUTPUT"
        echo "report_stamp=${STAMP}" >> "$GITHUB_OUTPUT"
        echo "report_branch=${target_branch}" >> "$GITHUB_OUTPUT"
        echo "[molley] Committed: ${REPORT_PATHS} on ${target_branch}"

    - name: Send report(s) to Slack / Teams / Google Chat
      if: steps.commit.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ROUTES: ${{ inputs.routes }}
        DAYS: ${{ inputs.days }}
        REPORTS_DIR: ${{ inputs.reports_dir }}
        GENERATED_STYLES: ${{ steps.report.outputs.generated_styles }}
        REPORT_STAMP: ${{ steps.commit.outputs.report_stamp }}
        REPORT_BRANCH: ${{ steps.commit.outputs.report_branch }}
        SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        TEAMS_WEBHOOK_URL: ${{ env.TEAMS_WEBHOOK_URL }}
        GOOGLE_CHAT_WEBHOOK_URL: ${{ env.GOOGLE_CHAT_WEBHOOK_URL }}
      run: |
        set -euo pipefail

        if [ -z "${ROUTES:-}" ] && [ -z "${SLACK_WEBHOOK_URL:-}" ] && [ -z "${TEAMS_WEBHOOK_URL:-}" ] && [ -z "${GOOGLE_CHAT_WEBHOOK_URL:-}" ]; then
          echo "[molley] No routes and no webhook URLs configured — skipping outward delivery"
          exit 0
        fi

        # Build a full-report, single-message payload per platform. Each platform
        # has its own text dialect and size limits, so the whole conversion lives
        # in one node script (quoted heredoc: no shell expansion inside).
        BUILDER="$(mktemp --suffix=.js)"
        cat > "$BUILDER" <<'NODE_EOF'
        const fs = require('fs');
        const service = process.env.SERVICE;
        const title = process.env.TITLE;
        const report = fs.readFileSync(process.env.REPORT_FILE, 'utf8').trim();
        const truncNote = `… report truncated for chat — the full version is committed in the repository at ${process.env.REPORT_PATH} on ${process.env.REPORT_BRANCH}`;

        // Split on H2 boundaries, then hard-split any oversized section on a line break.
        function chunk(text, maxLen) {
          const out = [];
          for (const section of text.split(/\n(?=## )/)) {
            let rest = section.trim();
            while (rest.length > maxLen) {
              let cut = rest.lastIndexOf('\n', maxLen);
              if (cut < maxLen * 0.5) cut = maxLen;
              out.push(rest.slice(0, cut).trim());
              rest = rest.slice(cut).trim();
            }
            if (rest) out.push(rest);
          }
          return out;
        }

        // Keep chunks until the total budget is spent; flag if anything was dropped.
        function fitBudget(chunks, budget) {
          const kept = [];
          let used = 0;
          for (const c of chunks) {
            if (used + c.length > budget) return { kept, truncated: true };
            kept.push(c);
            used += c.length;
          }
          return { kept, truncated: false };
        }

        let payload;

        if (service === 'slack') {
          // mrkdwn: headers become bold, ** becomes *. 3000-char block limit, 50-block message limit.
          const toMrkdwn = (t) => t
            .replace(/^#{1,6}\s+(.*)$/gm, '*$1*')
            .replace(/\*\*(.+?)\*\*/g, '*$1*');
          const { kept, truncated } = fitBudget(chunk(toMrkdwn(report), 2900), 36000);
          const blocks = [
            { type: 'header', text: { type: 'plain_text', text: title, emoji: true } },
            ...kept.slice(0, 47).map((c) => ({ type: 'section', text: { type: 'mrkdwn', text: c } })),
          ];
          if (truncated || kept.length > 47) {
            blocks.push({ type: 'context', elements: [{ type: 'mrkdwn', text: truncNote }] });
          }
          payload = { text: title, blocks };
        }

        if (service === 'teams') {
          // Adaptive Card TextBlocks render basic markdown but not # headers.
          const toCardMd = (t) => t.replace(/^#{1,6}\s+(.*)$/gm, '**$1**');
          const { kept, truncated } = fitBudget(chunk(toCardMd(report), 6000), 24000);
          const body = [
            { type: 'TextBlock', size: 'Large', weight: 'Bolder', wrap: true, text: title },
            ...kept.map((c) => ({ type: 'TextBlock', wrap: true, separator: true, text: c })),
          ];
          if (truncated) body.push({ type: 'TextBlock', wrap: true, isSubtle: true, text: truncNote });
          payload = {
            type: 'message',
            attachments: [{
              contentType: 'application/vnd.microsoft.card.adaptive',
              content: {
                $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                type: 'AdaptiveCard',
                version: '1.4',
                body,
              },
            }],
          };
        }

        if (service === 'gchat') {
          // textParagraph takes limited HTML: escape, then headers/bold to <b>, newlines to <br>.
          const toHtml = (t) => t
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>')
            .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
            .replace(/\n/g, '<br>');
          const { kept, truncated } = fitBudget(chunk(report, 6000), 24000);
          const widgets = kept.map((c) => ({ textParagraph: { text: toHtml(c) } }));
          if (truncated) widgets.push({ textParagraph: { text: '<i>' + toHtml(truncNote) + '</i>' } });
          payload = {
            cardsV2: [{
              cardId: 'molley-progress-report',
              card: {
                header: { title },
                sections: [{ widgets }],
              },
            }],
          };
        }

        fs.writeFileSync(process.env.PAYLOAD_FILE, JSON.stringify(payload));
        NODE_EOF

        deliver() {
          local service_key="$1"
          local webhook_url="$2"
          local label="$3"
          echo "[molley] Sending full report to ${label}"
          local payload_file
          payload_file="$(mktemp)"
          SERVICE="$service_key" PAYLOAD_FILE="$payload_file" node "$BUILDER"
          if curl --fail --silent --show-error -X POST "$webhook_url" \
            -H 'content-type: application/json; charset=UTF-8' --data-binary @"$payload_file" > /dev/null; then
            echo "[molley] ${label} delivery OK"
          else
            echo "[molley] ${label} delivery failed"
          fi
          rm -f "$payload_file"
        }

        export REPORT_BRANCH

        for STYLE in $GENERATED_STYLES; do
          export REPORT_FILE="/tmp/molley-progress-report-${STYLE}.md"
          export REPORT_PATH="${REPORTS_DIR}/${REPORT_STAMP}-${STYLE}.md"
          export TITLE="Product Progress Report (${STYLE}) — last ${DAYS} days"

          if [ -n "${ROUTES:-}" ]; then
            # Destinations for this style, one 'platform|ENV_VAR' per line
            DESTS="$(STYLE="$STYLE" node -e "
              const style = process.env.STYLE;
              for (const line of (process.env.ROUTES || '').split('\n')) {
                const t = line.trim();
                if (!t) continue;
                const i = t.indexOf(':');
                if (t.slice(0, i).trim().toLowerCase() !== style) continue;
                for (const d of t.slice(i + 1).split(',')) {
                  const dt = d.trim();
                  if (!dt) continue;
                  const j = dt.indexOf(':');
                  console.log(dt.slice(0, j).trim().toLowerCase() + '|' + dt.slice(j + 1).trim());
                }
              }
            ")"
            if [ -z "$DESTS" ]; then
              echo "[molley] No destinations routed for style ${STYLE}"
              continue
            fi
            while IFS='|' read -r platform env_name; do
              if [ -z "$platform" ]; then
                continue
              fi
              url="${!env_name:-}"
              if [ -z "$url" ]; then
                echo "[molley] Env var ${env_name} is not set or empty — skipping ${platform} delivery for ${STYLE}"
                continue
              fi
              deliver "$platform" "$url" "${platform}:${env_name} (${STYLE})"
            done <<< "$DESTS"
          else
            if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
              deliver "slack" "$SLACK_WEBHOOK_URL" "Slack (${STYLE})"
            fi
            if [ -n "${TEAMS_WEBHOOK_URL:-}" ]; then
              deliver "teams" "$TEAMS_WEBHOOK_URL" "Teams (${STYLE})"
            fi
            if [ -n "${GOOGLE_CHAT_WEBHOOK_URL:-}" ]; then
              deliver "gchat" "$GOOGLE_CHAT_WEBHOOK_URL" "Google Chat (${STYLE})"
            fi
          fi
        done

        rm -f "$BUILDER"
