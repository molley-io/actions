name: Molley Code Analyzer
description: Analyze repository features and sync results back to Molley

author: Molley

inputs:
  run_id:
    description: Correlation id generated by Molley
    required: false
  molley_project_id:
    description: Molley project id
    required: false
  analysis_depth:
    description: high-level | component-level | detailed
    required: false
    default: high-level
  directories:
    description: Comma-separated directories to focus on
    required: false
    default: ''
  force:
    description: Force full analysis
    required: false
    default: 'false'
  features_file_path:
    description: Path to features markdown in the target repository
    required: false
    default: .molley/features.md
  architecture_diagram_path:
    description: Path to the Excalidraw architecture diagram JSON in the target repository
    required: false
    default: .molley/architecture.excalidraw
  webhook_url:
    description: Public Molley webhook URL
    required: false
    default: https://api.molley.io/service/api-tenant/public/github/analyzer/webhook
  mode:
    description: 'analyzer | analyze | build'
    required: false
    default: analyzer

outputs:
  head_sha:
    description: HEAD sha after analyzer commit
    value: ${{ steps.git-state.outputs.head_sha }}
  features_file_path:
    description: Resolved output features file path
    value: ${{ inputs.features_file_path }}
  architecture_diagram_path:
    description: Resolved output architecture diagram path
    value: ${{ inputs.architecture_diagram_path }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate required environment
      shell: bash
      run: |
        set -euo pipefail
        echo "[molley] Validating required environment"
        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "ANTHROPIC_API_KEY is required"
          exit 1
        fi
        echo "[molley] ANTHROPIC_API_KEY is present"

    - name: Install Claude Code CLI
      shell: bash
      run: |
        set -euo pipefail
        echo "[molley] Installing Claude Code CLI"
        npm install -g @anthropic-ai/claude-code
        echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
        echo "[molley] Node version: $(node --version)"
        echo "[molley] npm version: $(npm --version)"

    - name: Setup Molley MCP Server for product context
      id: mcp-setup
      continue-on-error: true
      shell: bash
      env:
        MOLLEY_API_KEY: ${{ env.MOLLEY_API_KEY }}
        MOLLEY_COMPANY_ID: ${{ env.MOLLEY_COMPANY_ID }}
        MOLLEY_PROJECT_PASSPORT: ${{ inputs.molley_project_id }}
      run: |
        set -euo pipefail

        if [ -z "${MOLLEY_API_KEY:-}" ]; then
          echo "[molley] MOLLEY_API_KEY not set — skipping MCP server setup (product context will not be available)"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RESOLVED_COMPANY_ID="${MOLLEY_COMPANY_ID:-}"
        RESOLVED_PROJECT_ID=""

        if [ -n "${MOLLEY_PROJECT_PASSPORT:-}" ]; then
          DECODED=$(node -e "
            const passport = process.env.MOLLEY_PROJECT_PASSPORT || '';
            const encoded = passport.split('.')[0] || '';
            try {
              const json = JSON.parse(Buffer.from(encoded, 'base64url').toString('utf8'));
              process.stdout.write(JSON.stringify(json));
            } catch { process.stdout.write('{}'); }
          " 2>/dev/null || echo '{}')

          PASSPORT_COMPANY=$(echo "$DECODED" | node -e "const d=require('fs').readFileSync(0,'utf8');try{process.stdout.write(JSON.parse(d).companyId||'')}catch{}" 2>/dev/null || true)
          PASSPORT_PROJECT=$(echo "$DECODED" | node -e "const d=require('fs').readFileSync(0,'utf8');try{process.stdout.write(JSON.parse(d).projectId||'')}catch{}" 2>/dev/null || true)

          if [ -z "$RESOLVED_COMPANY_ID" ] && [ -n "$PASSPORT_COMPANY" ]; then
            RESOLVED_COMPANY_ID="$PASSPORT_COMPANY"
          fi
          if [ -n "$PASSPORT_PROJECT" ]; then
            RESOLVED_PROJECT_ID="$PASSPORT_PROJECT"
          fi
        fi

        if [ -z "$RESOLVED_COMPANY_ID" ]; then
          echo "[molley] Cannot resolve company ID — skipping MCP server setup"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "[molley] Installing Molley MCP server"
        npm install -g @molley/mcp-server

        echo "[molley] Configuring MCP server credentials"
        npx @molley/mcp-server login --api-key "$MOLLEY_API_KEY" --company-id "$RESOLVED_COMPANY_ID"

        if command -v claude-code >/dev/null 2>&1; then
          CLAUDE_BIN="claude-code"
        elif command -v claude >/dev/null 2>&1; then
          CLAUDE_BIN="claude"
        else
          echo "[molley] Claude CLI not found — skipping MCP registration"
          echo "mcp_available=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "[molley] Registering MCP server with Claude Code"
        "$CLAUDE_BIN" mcp add molley -- npx @molley/mcp-server

        echo "mcp_available=true" >> "$GITHUB_OUTPUT"
        echo "project_id=${RESOLVED_PROJECT_ID}" >> "$GITHUB_OUTPUT"
        echo "[molley] MCP server configured — product context will be available during analysis"

    - name: Generate features markdown with Claude Code
      id: analyze
      continue-on-error: true
      shell: bash
      env:
        MOLLEY_MODE: ${{ inputs.mode }}
        ANALYSIS_DEPTH: ${{ inputs.analysis_depth }}
        ANALYZE_DIRECTORIES: ${{ inputs.directories }}
        FEATURES_FILE_PATH: ${{ inputs.features_file_path }}
        MCP_AVAILABLE: ${{ steps.mcp-setup.outputs.mcp_available }}
        MCP_PROJECT_ID: ${{ steps.mcp-setup.outputs.project_id }}
      run: |
        set -euo pipefail
        echo "[molley] Starting Claude Code step — mode: ${MOLLEY_MODE}"
        ANALYZER_FAILED=0
        CLAUDE_MODEL="claude-opus-4-6"
        PROMPT_FILE="$(mktemp)"
        ANALYSIS_RESULT_FILE="/tmp/molley-analysis-result.txt"

        if [ "$MOLLEY_MODE" = "analyzer" ]; then
          echo "[molley] Analysis depth: ${ANALYSIS_DEPTH}"
          echo "[molley] Focus directories: ${ANALYZE_DIRECTORIES:-<all>}"
          echo "[molley] Features output: ${FEATURES_FILE_PATH}"
          mkdir -p "$(dirname "$FEATURES_FILE_PATH")"
          OUTPUT_FILE="$FEATURES_FILE_PATH"
          {
            if [ "${MCP_AVAILABLE:-false}" = "true" ] && [ -n "${MCP_PROJECT_ID:-}" ]; then
              printf '%s\n' "IMPORTANT: Before analyzing code, use the Molley MCP server to understand the full product context."
              printf '%s\n' "Call the get_analyzer_context tool with projectId '${MCP_PROJECT_ID}' to retrieve:"
              printf '%s\n' "- The product description, market understanding, business model, and go-to-market strategy"
              printf '%s\n' "- All features/ideas already tracked in Molley with their status and priority"
              printf '%s\n' "- Product wiki note titles (use get_note if any seem relevant to the analysis)"
              printf '%s\n' "Use this product context to inform your analysis. This repository may be ONE of several repositories that make up the product (poly-repo). Do not duplicate features already tracked — only add new ones, update changed ones, or flag removed ones."
              printf '%s\n' ""
            fi

            printf '%s\n' "Analyze this repository and produce markdown content for ${FEATURES_FILE_PATH}."
            printf '%s\n' "Return markdown only (no prose before/after)."
            printf '%s\n' "Output one section per feature using: '## <Feature Name>' then bullets for '**Status:**', '**Description:**', '**Key Files:**', and '**Dependencies:**'."
            printf '%s\n' "De-duplicate features semantically: if an existing feature represents the same capability, keep one canonical section and do not create a renamed duplicate."
            printf '%s\n' "Preserve already-known features unless they are clearly incorrect."
            printf '%s\n' "Analysis depth: ${ANALYSIS_DEPTH}. Focus directories: ${ANALYZE_DIRECTORIES}."

            if [ -s "$FEATURES_FILE_PATH" ]; then
              printf '\n%s\n' "Existing feature baseline from ${FEATURES_FILE_PATH} (treat as already known features):"
              printf '%s\n' "-----BEGIN EXISTING FEATURES-----"
              head -c 15000 "$FEATURES_FILE_PATH"
              printf '%s\n' "-----END EXISTING FEATURES-----"
              echo "[molley] Seeded analyzer prompt with existing features baseline" >&2
            else
              echo "[molley] No existing features baseline found; running full analysis" >&2
            fi
          } > "$PROMPT_FILE"
        else
          OUTPUT_FILE="$ANALYSIS_RESULT_FILE"
          # For push-triggered runs, github.event.inputs.mode is empty and defaults
          # to 'build', so we can't rely on MOLLEY_MODE alone. Check both files.
          REQ_FILE=""
          if [ -f ".molley/analyze-request.json" ]; then
            REQ_FILE=".molley/analyze-request.json"
          elif [ -f ".molley/build-request.json" ]; then
            REQ_FILE=".molley/build-request.json"
          fi
          if [ -n "$REQ_FILE" ]; then
            echo "[molley] Reading prompt from ${REQ_FILE}"
            REQ_FILE="$REQ_FILE" node -e "
              const fs = require('fs');
              const req = JSON.parse(fs.readFileSync(process.env.REQ_FILE, 'utf8'));
              process.stdout.write(req.prompt || '');
            " > "$PROMPT_FILE"
          fi
          if [ ! -s "$PROMPT_FILE" ]; then
            echo "[molley] No request file or prompt found for mode ${MOLLEY_MODE}"
            ANALYZER_FAILED=1
          fi
        fi

        PROMPT="$(cat "$PROMPT_FILE")"

        if command -v claude-code >/dev/null 2>&1; then
          CLAUDE_BIN="claude-code"
        elif command -v claude >/dev/null 2>&1; then
          CLAUDE_BIN="claude"
        else
          CLAUDE_BIN=""
        fi

        if [ -n "$CLAUDE_BIN" ]; then
          echo "[molley] Using CLI binary: $CLAUDE_BIN"
          CLI_HELP="$($CLAUDE_BIN --help 2>&1 || true)"
          MODEL_ARGS=()
          if printf '%s' "$CLI_HELP" | grep -q -- '--model'; then
            MODEL_ARGS=(--model "$CLAUDE_MODEL")
            echo "[molley] Using model: ${CLAUDE_MODEL}"
          else
            echo "[molley] CLI does not support --model flag; using CLI default model"
          fi
          heartbeat() {
            while true; do
              echo "[molley] Analyzer still running..."
              sleep 20
            done
          }

          heartbeat &
          HEARTBEAT_PID=$!

          HAS_PRINT=0
          HAS_PROMPT=0
          HAS_SKIP_PERMS=0
          printf '%s' "$CLI_HELP" | grep -q -- '--print' && HAS_PRINT=1
          printf '%s' "$CLI_HELP" | grep -q -- '--prompt' && HAS_PROMPT=1
          printf '%s' "$CLI_HELP" | grep -q -- '--dangerously-skip-permissions' && HAS_SKIP_PERMS=1

          if [ "$MOLLEY_MODE" = "build" ]; then
            # Build mode: Claude must write files, so use --prompt (not --print)
            # and --dangerously-skip-permissions to allow file writes in CI
            echo "[molley] Build mode — using interactive prompt with file-write permissions"
            if [ "$HAS_PROMPT" = "1" ]; then
              if [ "$HAS_SKIP_PERMS" = "1" ]; then
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --dangerously-skip-permissions --prompt "$PROMPT" || ANALYZER_FAILED=1
              else
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --prompt "$PROMPT" || ANALYZER_FAILED=1
              fi
            elif [ "$HAS_SKIP_PERMS" = "1" ]; then
              "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --dangerously-skip-permissions "$PROMPT" || ANALYZER_FAILED=1
            else
              "$CLAUDE_BIN" "${MODEL_ARGS[@]}" "$PROMPT" || ANALYZER_FAILED=1
            fi
          elif [ "${MCP_AVAILABLE:-false}" = "true" ] && [ "$HAS_PROMPT" = "1" ]; then
            # MCP available: use --prompt so Claude can call MCP tools for product context
            # Claude will write the output file directly via tool use
            echo "[molley] Running with --prompt (MCP product context enabled)"
            if [ "$HAS_SKIP_PERMS" = "1" ]; then
              "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --dangerously-skip-permissions --prompt "$PROMPT" || ANALYZER_FAILED=1
            else
              "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --prompt "$PROMPT" || ANALYZER_FAILED=1
            fi
          else
            # Analyzer / Analyze mode without MCP: capture text output only via --print
            if [ "$HAS_PRINT" = "1" ]; then
              echo "[molley] Running with --print and writing output file"
              "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --print "$PROMPT" > "$OUTPUT_FILE" || ANALYZER_FAILED=1
            elif [ "$HAS_PROMPT" = "1" ]; then
              echo "[molley] Running with --prompt"
              if [ "$HAS_SKIP_PERMS" = "1" ]; then
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --dangerously-skip-permissions --prompt "$PROMPT" || ANALYZER_FAILED=1
              else
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --prompt "$PROMPT" || ANALYZER_FAILED=1
              fi
            else
              echo "[molley] Running with positional prompt"
              if [ "$HAS_SKIP_PERMS" = "1" ]; then
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --dangerously-skip-permissions "$PROMPT" || ANALYZER_FAILED=1
              else
                "$CLAUDE_BIN" "${MODEL_ARGS[@]}" "$PROMPT" || ANALYZER_FAILED=1
              fi
            fi
          fi

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          wait "$HEARTBEAT_PID" 2>/dev/null || true
        else
          echo "Claude CLI binary not found after install; using fallback output"
          ANALYZER_FAILED=1
        fi

        if [ -s "$OUTPUT_FILE" ] && grep -qi 'blocked pending your approval' "$OUTPUT_FILE"; then
          echo "[molley] Claude response indicates permission approval block"
          ANALYZER_FAILED=1
          rm -f "$OUTPUT_FILE"
        fi

        rm -f "$PROMPT_FILE"

        if [ "$MOLLEY_MODE" = "analyzer" ]; then
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "[molley] Analyzer did not produce features markdown; writing fallback content"
            printf '%s\n' \
              '# Project Features' \
              '' \
              '## Codebase Analysis Pending' \
              '- **Status:** Implemented' \
              '- **Description:** Analyzer fallback output generated because the AI step did not produce markdown in this run.' \
              '- **Key Files:** None' \
              '- **Dependencies:** None' \
              > "$OUTPUT_FILE"
          fi
          echo "[molley] Features markdown size: $(wc -c < "$OUTPUT_FILE") bytes"
        else
          if [ -s "$OUTPUT_FILE" ]; then
            echo "[molley] Analysis result size: $(wc -c < "$OUTPUT_FILE") bytes"
          else
            echo "[molley] No analysis output produced"
          fi
        fi

        if [ "$ANALYZER_FAILED" -ne 0 ]; then
          echo "Claude step failed"
          exit 1
        fi

        echo "[molley] Claude Code step completed successfully"

    - name: Generate architecture diagram with Claude Code
      id: architecture
      if: inputs.mode == 'analyzer' && steps.analyze.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        ARCHITECTURE_DIAGRAM_PATH: ${{ inputs.architecture_diagram_path }}
        FEATURES_FILE_PATH: ${{ inputs.features_file_path }}
      run: |
        set -euo pipefail
        echo "[molley] Generating architecture diagram"
        mkdir -p "$(dirname "$ARCHITECTURE_DIAGRAM_PATH")"
        ARCH_PROMPT_FILE="$(mktemp)"

        {
          printf '%s\n' "Analyze this repository and produce an Excalidraw JSON diagram representing the product's technical architecture."
          printf '%s\n' "Return ONLY valid JSON (no markdown fences, no prose before/after)."
          printf '%s\n' "The JSON must be a valid Excalidraw scene with this structure: { \"type\": \"excalidraw\", \"version\": 2, \"elements\": [...], \"appState\": { \"viewBackgroundColor\": \"#ffffff\" } }"
          printf '%s\n' "Show the main services, databases, APIs, frontends, and external integrations as rectangles with descriptive text labels."
          printf '%s\n' "Connect them with arrows showing data flow and dependencies."
          printf '%s\n' "Use a clean left-to-right or top-to-bottom layout."
          printf '%s\n' "Use these Excalidraw element types: rectangle, text, arrow, line."
          printf '%s\n' "Each element needs: id, type, x, y, width, height, strokeColor, backgroundColor, fillStyle, strokeWidth, and type-specific properties."
          printf '%s\n' "For text elements include: text, fontSize (16-20), fontFamily (1 for Virgil)."
          printf '%s\n' "For arrows include: points array, startBinding/endBinding with elementId references."
          if [ -s "$FEATURES_FILE_PATH" ]; then
            printf '\n%s\n' "Use the features from ${FEATURES_FILE_PATH} to inform the architecture:"
            head -c 10000 "$FEATURES_FILE_PATH"
          fi
          if [ -s "$ARCHITECTURE_DIAGRAM_PATH" ]; then
            printf '\n%s\n' "Existing architecture diagram to update and improve:"
            head -c 50000 "$ARCHITECTURE_DIAGRAM_PATH"
          fi
        } > "$ARCH_PROMPT_FILE"

        ARCH_PROMPT="$(cat "$ARCH_PROMPT_FILE")"

        if command -v claude-code >/dev/null 2>&1; then
          CLAUDE_BIN="claude-code"
        elif command -v claude >/dev/null 2>&1; then
          CLAUDE_BIN="claude"
        else
          CLAUDE_BIN=""
        fi

        ARCH_FAILED=0
        CLAUDE_MODEL="claude-sonnet-4-20250514"
        if [ -n "$CLAUDE_BIN" ]; then
          CLI_HELP="$($CLAUDE_BIN --help 2>&1 || true)"
          MODEL_ARGS=()
          if printf '%s' "$CLI_HELP" | grep -q -- '--model'; then
            MODEL_ARGS=(--model "$CLAUDE_MODEL")
          fi
          HAS_PRINT=0
          printf '%s' "$CLI_HELP" | grep -q -- '--print' && HAS_PRINT=1

          if [ "$HAS_PRINT" = "1" ]; then
            "$CLAUDE_BIN" "${MODEL_ARGS[@]}" --print "$ARCH_PROMPT" > "$ARCHITECTURE_DIAGRAM_PATH" || ARCH_FAILED=1
          else
            "$CLAUDE_BIN" "${MODEL_ARGS[@]}" "$ARCH_PROMPT" > "$ARCHITECTURE_DIAGRAM_PATH" || ARCH_FAILED=1
          fi
        else
          ARCH_FAILED=1
        fi

        rm -f "$ARCH_PROMPT_FILE"

        if [ "$ARCH_FAILED" -ne 0 ] || [ ! -s "$ARCHITECTURE_DIAGRAM_PATH" ]; then
          echo "[molley] Architecture diagram generation failed or empty; skipping"
          rm -f "$ARCHITECTURE_DIAGRAM_PATH"
          exit 0
        fi

        # Validate JSON
        if ! node -e "JSON.parse(require('fs').readFileSync(process.env.ARCHITECTURE_DIAGRAM_PATH, 'utf8'))" 2>/dev/null; then
          echo "[molley] Architecture diagram output is not valid JSON; attempting to extract JSON"
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.ARCHITECTURE_DIAGRAM_PATH, 'utf8');
            const match = raw.match(/\\{[\\s\\S]*\\}/); 
            if (match) {
              JSON.parse(match[0]);
              fs.writeFileSync(process.env.ARCHITECTURE_DIAGRAM_PATH, match[0]);
              process.stderr.write('[molley] Extracted valid JSON from output\n');
            } else {
              process.stderr.write('[molley] Could not extract valid JSON; removing file\n');
              fs.unlinkSync(process.env.ARCHITECTURE_DIAGRAM_PATH);
            }
          " 2>&1 || rm -f "$ARCHITECTURE_DIAGRAM_PATH"
        fi

        if [ -s "$ARCHITECTURE_DIAGRAM_PATH" ]; then
          echo "[molley] Architecture diagram size: $(wc -c < "$ARCHITECTURE_DIAGRAM_PATH") bytes"
        else
          echo "[molley] No valid architecture diagram produced"
        fi

    - name: Commit analyzer output
      id: commit
      if: inputs.mode == 'analyzer'
      shell: bash
      env:
        FEATURES_FILE_PATH: ${{ inputs.features_file_path }}
      run: |
        set -euo pipefail
        echo "[molley] Checking for analyzer output changes"
        git config user.name "molley-bot"
        git config user.email "actions@users.noreply.github.com"

        ARCHITECTURE_DIAGRAM_PATH="${{ inputs.architecture_diagram_path }}"
        target_branch="${GITHUB_REF_NAME:-main}"
        snapshot_file="$(mktemp)"
        cp "$FEATURES_FILE_PATH" "$snapshot_file"
        arch_snapshot_file="$(mktemp)"
        HAS_ARCH="false"
        if [ -s "$ARCHITECTURE_DIAGRAM_PATH" ]; then
          cp "$ARCHITECTURE_DIAGRAM_PATH" "$arch_snapshot_file"
          HAS_ARCH="true"
        fi

        pushed="false"
        changed="false"

        for attempt in 1 2 3; do
          echo "[molley] Sync attempt ${attempt}/3 on branch ${target_branch}"
          git fetch origin "$target_branch"
          git checkout -B "molley-analyzer-${GITHUB_RUN_ID:-local}" "origin/$target_branch"

          mkdir -p "$(dirname "$FEATURES_FILE_PATH")"
          cp "$snapshot_file" "$FEATURES_FILE_PATH"
          if [ "$HAS_ARCH" = "true" ]; then
            mkdir -p "$(dirname "$ARCHITECTURE_DIAGRAM_PATH")"
            cp "$arch_snapshot_file" "$ARCHITECTURE_DIAGRAM_PATH"
          fi

          git add "$FEATURES_FILE_PATH"
          if [ "$HAS_ARCH" = "true" ]; then
            git add "$ARCHITECTURE_DIAGRAM_PATH"
          fi
          if git diff --cached --quiet; then
            echo "[molley] No changes to commit after syncing with origin/${target_branch}"
            changed="false"
            pushed="true"
            break
          fi

          changed="true"
          git commit -m "chore(molley): update features analysis"

          if git push origin "HEAD:${target_branch}"; then
            echo "[molley] Changes pushed to ${target_branch}"
            pushed="true"
            break
          fi

          echo "[molley] Push failed due to branch movement; retrying"
        done

        rm -f "$snapshot_file" "$arch_snapshot_file"

        if [ "$pushed" != "true" ]; then
          echo "[molley] Failed to push analyzer output after retries"
          exit 1
        fi

        echo "changed=${changed}" >> "$GITHUB_OUTPUT"

    - name: Commit and PR build output
      id: build-commit
      if: inputs.mode == 'build' && steps.analyze.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "[molley] Checking for build output changes"
        git config user.name "molley-bot"
        git config user.email "actions@users.noreply.github.com"

        BRANCH_NAME="${GITHUB_REF_NAME}"
        FILES_CHANGED=$(git diff --name-only | wc -l)
        UNTRACKED=$(git ls-files --others --exclude-standard | wc -l)
        TOTAL_CHANGED=$((FILES_CHANGED + UNTRACKED))

        echo "[molley] Files modified: ${FILES_CHANGED}, new: ${UNTRACKED}, total: ${TOTAL_CHANGED}"

        if [ "$TOTAL_CHANGED" -eq 0 ]; then
          echo "[molley] No file changes detected from build"
          echo "files_changed=0" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git add -A
        git commit -m "feat(molley): code writer build output"

        git push origin "HEAD:${BRANCH_NAME}"
        echo "[molley] Pushed build changes to ${BRANCH_NAME}"

        echo "files_changed=${TOTAL_CHANGED}" >> "$GITHUB_OUTPUT"
        echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

        # Attempt to create a PR if gh CLI is available
        if command -v gh >/dev/null 2>&1; then
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name' 2>/dev/null || echo "main")
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "[molley] PR #${EXISTING_PR} already exists for ${BRANCH_NAME}"
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url' 2>/dev/null || true)
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "[molley] Creating PR from ${BRANCH_NAME} → ${DEFAULT_BRANCH}"
            PR_OUTPUT=$(gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "feat(molley): code writer build" \
              --body "Automated code changes generated by [Molley Code Writer](https://molley.io)." \
              2>&1 || true)
            echo "[molley] PR create output: ${PR_OUTPUT}"

            PR_URL=$(echo "$PR_OUTPUT" | grep -oE 'https://github.com/[^ ]+/pull/[0-9]+' | head -1 || true)
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$' || true)
            if [ -n "$PR_URL" ]; then
              echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "[molley] Created PR #${PR_NUMBER}: ${PR_URL}"
            fi
          fi
        else
          echo "[molley] gh CLI not available; skipping PR creation"
        fi

    - name: Read git state
      id: git-state
      shell: bash
      run: |
        set -euo pipefail
        echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "[molley] HEAD SHA: $(git rev-parse HEAD)"

    - name: Notify Molley webhook
      if: always()
      shell: bash
      env:
        MOLLEY_MODE: ${{ inputs.mode }}
        ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        BUILD_COMMIT_OUTCOME: ${{ steps.build-commit.outcome }}
        RUN_ID: ${{ inputs.run_id }}
        MOLLEY_PROJECT_ID: ${{ inputs.molley_project_id }}
        ANALYSIS_DEPTH: ${{ inputs.analysis_depth }}
        FEATURES_FILE_PATH: ${{ inputs.features_file_path }}
        ARCHITECTURE_DIAGRAM_PATH: ${{ inputs.architecture_diagram_path }}
        WEBHOOK_URL: ${{ inputs.webhook_url }}
        HEAD_SHA: ${{ steps.git-state.outputs.head_sha }}
        BUILD_FILES_CHANGED: ${{ steps.build-commit.outputs.files_changed }}
        BUILD_BRANCH_NAME: ${{ steps.build-commit.outputs.branch_name }}
        BUILD_PR_URL: ${{ steps.build-commit.outputs.pr_url }}
        BUILD_PR_NUMBER: ${{ steps.build-commit.outputs.pr_number }}
      run: |
        set -euo pipefail
        echo "[molley] Preparing webhook callback — mode: ${MOLLEY_MODE}"

        if [ "$MOLLEY_MODE" = "analyzer" ]; then
          if [ "$ANALYZE_OUTCOME" = "success" ] && [ "$COMMIT_OUTCOME" = "success" ]; then
            EVENT="analyzer.completed"
            CONCLUSION="success"
          else
            EVENT="analyzer.failed"
            CONCLUSION="failure"
          fi
        elif [ "$MOLLEY_MODE" = "build" ]; then
          if [ "$ANALYZE_OUTCOME" = "success" ] && [ "$BUILD_COMMIT_OUTCOME" = "success" ]; then
            EVENT="build_complete"
            CONCLUSION="success"
          else
            EVENT="failed"
            CONCLUSION="failure"
          fi
        else
          if [ "$ANALYZE_OUTCOME" = "success" ]; then
            EVENT="analysis_complete"
            CONCLUSION="success"
          else
            EVENT="failed"
            CONCLUSION="failure"
          fi
        fi

        EFFECTIVE_RUN_ID="$RUN_ID"
        if [ -z "$EFFECTIVE_RUN_ID" ]; then
          EFFECTIVE_RUN_ID="$GITHUB_RUN_ID"
        fi

        completed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        PAYLOAD_FILE="$(mktemp)"
        EFFECTIVE_RUN_ID="$EFFECTIVE_RUN_ID" CONCLUSION="$CONCLUSION" EVENT="$EVENT" COMPLETED_AT="$completed_at" MOLLEY_MODE="$MOLLEY_MODE" BUILD_FILES_CHANGED="$BUILD_FILES_CHANGED" BUILD_BRANCH_NAME="$BUILD_BRANCH_NAME" BUILD_PR_URL="$BUILD_PR_URL" BUILD_PR_NUMBER="$BUILD_PR_NUMBER" PAYLOAD_FILE="$PAYLOAD_FILE" node -e "
          const fs = require('fs');
          const payload = {
            runId: process.env.EFFECTIVE_RUN_ID,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            repository: {
              owner: process.env.GITHUB_REPOSITORY_OWNER,
              name: (process.env.GITHUB_REPOSITORY || '').split('/').slice(1).join('/'),
              defaultBranch: process.env.GITHUB_REF_NAME,
            },
            headSha: process.env.HEAD_SHA,
            conclusion: process.env.CONCLUSION,
            featuresFilePath: process.env.FEATURES_FILE_PATH,
            analysisDepth: process.env.ANALYSIS_DEPTH,
            completedAt: process.env.COMPLETED_AT,
            event: process.env.EVENT,
            molleyProjectId: process.env.MOLLEY_PROJECT_ID,
          };
          if (process.env.MOLLEY_MODE === 'analyzer') {
            try {
              const featuresContent = fs.readFileSync(process.env.FEATURES_FILE_PATH, 'utf8');
              if (featuresContent) {
                payload.featuresMarkdown = featuresContent;
                process.stderr.write('[molley] Including features markdown (' + featuresContent.length + ' bytes)\n');
              }
            } catch {}
            try {
              const archPath = process.env.ARCHITECTURE_DIAGRAM_PATH;
              const archContent = fs.readFileSync(archPath, 'utf8');
              if (archContent) {
                JSON.parse(archContent);
                payload.architectureDiagram = archContent;
                process.stderr.write('[molley] Including architecture diagram (' + archContent.length + ' bytes)\n');
              }
            } catch {}
          }
          if (process.env.MOLLEY_MODE === 'analyze') {
            const resultFile = '/tmp/molley-analysis-result.txt';
            try {
              const content = fs.readFileSync(resultFile, 'utf8').slice(0, 102400);
              if (content) {
                payload.analysisResult = content;
                process.stderr.write('[molley] Including analysis result (' + content.length + ' bytes)\\n');
              }
            } catch {}
          }
          if (process.env.MOLLEY_MODE === 'build') {
            if (process.env.BUILD_FILES_CHANGED) payload.filesChanged = Number(process.env.BUILD_FILES_CHANGED) || 0;
            if (process.env.BUILD_BRANCH_NAME) payload.branchName = process.env.BUILD_BRANCH_NAME;
            if (process.env.BUILD_PR_URL) payload.prUrl = process.env.BUILD_PR_URL;
            if (process.env.BUILD_PR_NUMBER) payload.prNumber = Number(process.env.BUILD_PR_NUMBER) || undefined;
          }
          fs.writeFileSync(process.env.PAYLOAD_FILE, JSON.stringify(payload));
        "

        curl_headers=(
          -H 'content-type: application/json'
          -H "x-molley-event: ${EVENT}"
          -H "x-github-delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        )

        if [ -n "${MOLLEY_WEBHOOK_SECRET:-}" ]; then
          signature=$(openssl dgst -sha256 -hmac "$MOLLEY_WEBHOOK_SECRET" "$PAYLOAD_FILE" | sed 's/^.* //')
          curl_headers+=( -H "x-molley-signature: sha256=${signature}" )
        fi

        echo "[molley] Sending webhook event '${EVENT}' for run '${EFFECTIVE_RUN_ID}'"
        echo "[molley] Webhook URL: ${WEBHOOK_URL}"

        curl --fail --silent --show-error \
          -X POST "$WEBHOOK_URL" \
          "${curl_headers[@]}" \
          --data-binary @"$PAYLOAD_FILE"

        rm -f "$PAYLOAD_FILE"
        echo "[molley] Webhook callback delivered"
